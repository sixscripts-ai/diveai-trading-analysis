## Compose V2 no longer requires a top-level `version`. Removing it avoids warnings.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - app-network

  

networks:
  app-network:
    driver: bridge
